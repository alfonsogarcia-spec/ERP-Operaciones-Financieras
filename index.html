<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/public/logo-symbol.png" />
  <title>Polipay · Conciliación y Liquidación T+1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --oxford:#04003A; --electrico:#157BF6; --dodger:#0F56AC; --capri:#5BA3F9; --artico:#E8EAF5;
      --bg:#EFF2F5; --panel:#ffffff; --ink:#04003A; --muted:#707070; --line:#E4E6E7;
      --brand:#04003A; --accent:#157BF6; --accent-soft:#EDEEF7;
      --danger:#CC0000; --warn:#8A6A00; --warn-fill:#FFCC00; --ok:#4BB543; --violet:#7C5CE6;
      --shadow:0 6px 24px rgba(4,0,58,.06),0 1px 2px rgba(4,0,58,.04);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
    a{color:var(--accent);text-decoration:none}
    button{font-family:inherit;cursor:pointer}

    .layout{display:flex;min-height:100vh}
    .sidebar{width:248px;background:var(--oxford);color:#EAECF6;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06)}
    .sidebar .brand-logo{height:26px;width:auto;max-width:140px;display:block;margin:4px 8px 2px;filter:brightness(0) invert(1)}
    .sidebar .sub{font-size:11px;color:rgba(255,255,255,.55);margin:0 8px 22px}
    .sidebar nav{flex:1;overflow-y:auto;min-height:0}
    .sidebar .navlbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.42);margin:14px 12px 6px;font-weight:600}
    .sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:rgba(255,255,255,.78);margin-bottom:3px;font-weight:500;position:relative;cursor:pointer}
    .sidebar nav a img{width:18px;height:18px;object-fit:contain;opacity:.72;filter:brightness(0) invert(1);flex:none}
    .sidebar nav a:hover{background:rgba(255,255,255,.08);color:#fff}
    .sidebar nav a.active{background:var(--accent);color:#fff;font-weight:600}
    .sidebar nav a.active img{opacity:1}
    .sidebar nav a .count{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:grid;place-items:center}
    .sidebar nav a.active .count{background:#fff;color:var(--accent)}
    .sidebar-foot{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:rgba(255,255,255,.6)}
    .sidebar-foot .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.5);margin-bottom:5px}
    .sidebar-foot .who{color:#fff;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:8px}
    .sidebar-foot .avatar{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;background:var(--accent)}
    .sidebar-foot .rolech{font-size:11px;color:rgba(255,255,255,.6);font-weight:500}
    .sidebar-foot .btn.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16)}
    .sidebar-foot .btn.secondary:hover{background:rgba(255,255,255,.16)}

    /* Login */
    .login-screen{min-height:100vh;display:grid;place-items:center;background:var(--bg);padding:20px}
    .login-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(4,0,58,.12);width:100%;max-width:430px;padding:36px 32px}
    .login-card .brand-logo{height:30px;margin-bottom:8px}
    .login-card h1{font-size:20px;margin:12px 0 4px;color:var(--ink)}
    .login-card p.sub{color:var(--muted);font-size:13px;margin:0 0 22px}
    .login-card label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
    .login-card input,.login-card select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
    .login-card input:focus,.login-card select:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
    .login-card .btn{width:100%;justify-content:center;padding:12px;display:flex;margin-top:22px}
    .login-foot{font-size:11px;color:#9aa3b8;text-align:center;margin-top:18px}

    .content{flex:1;padding:28px 34px;max-width:1560px}
    .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .page-head h2{margin:0;font-size:22px;color:var(--ink);display:flex;align-items:center;gap:10px}
    .page-head .ph-sub{font-size:13px;color:var(--muted);margin-top:3px;font-weight:400}

    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:24px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
    .card .label{color:var(--muted);font-size:12px;font-weight:600}
    .card .value{font-size:28px;font-weight:700;margin-top:8px;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
    .card .hint{font-size:12px;color:var(--muted);margin-top:4px}
    .card.alert .value{color:var(--danger)}
    .card.ok .value{color:var(--ok)}

    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
    .panel h3{margin:0 0 14px;font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
    .panel h3 .right{margin-left:auto;display:flex;gap:8px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px}
    thead th{background:#fff;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0}
    tbody tr:hover{background:#F7F9FC}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    td .tt{font-weight:600;color:var(--ink)}
    td .tt small{display:block;color:var(--muted);font-weight:400;margin-top:2px;font-size:12px}
    .tablewrap{overflow:auto;max-height:none;border:1px solid var(--line);border-radius:12px}
    .tablewrap table{min-width:640px}

    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;letter-spacing:.01em}
    .badge.g{background:var(--muted)} .badge.b{background:var(--accent)} .badge.ok{background:var(--ok)}
    .badge.w{background:var(--warn-fill);color:#5A4600} .badge.d{background:var(--danger)} .badge.v{background:var(--violet)}
    .pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--artico);color:#475569;font-size:11px;font-weight:600}
    .dept{display:inline-block;padding:3px 10px;border-radius:999px;background:#E8EAF5;color:var(--accent);font-size:11px;font-weight:600}

    .btn{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;font-family:inherit;white-space:nowrap}
    .btn:hover{background:var(--dodger)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.secondary{background:var(--artico);color:var(--ink)}
    .btn.secondary:hover{background:#DCDFEF}
    .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
    .btn.sm{padding:8px 13px;font-size:12px;border-radius:10px}
    .btn.danger{background:#fff;border:1px solid var(--danger);color:var(--danger)}
    .btn.danger:hover{background:#FDEDED}
    .btn.ok{background:var(--ok)} .btn.ok:hover{background:#3da03a}

    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
    input,select,textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
    input:focus,select:focus,textarea:focus{outline:3px solid #E8EAF5;border-color:var(--accent)}
    textarea{resize:vertical;min-height:74px;width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px}
    .tabs{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;flex-wrap:wrap}
    .tab{padding:8px 15px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;font-family:inherit}
    .tab:hover{color:var(--ink);background:#EDEEF7}
    .tab.active{background:var(--accent);color:#fff}
    .spacer{flex:1}
    label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:14px}
    label.field input,label.field select,label.field textarea{font-weight:400;color:var(--ink);font-size:14px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    .form-grid.c3{grid-template-columns:1fr 1fr 1fr}
    .banner{background:#EDEEF7;border:1px solid #ABCAE9;color:#0F56AC;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px}
    .banner.warn{background:#FFF7D6;border-color:var(--warn-fill);color:#7a5a12}
    .banner.err{background:#FDEDED;border-color:#F3B4B4;color:#8a1f1f}
    .banner.ok{background:#EAF7EC;border-color:#B7E0BC;color:#256a2b}
    .empty{text-align:center;color:var(--muted);padding:36px}
    .muted{color:var(--muted)}
    .mono{font-family:ui-monospace,Menlo,monospace}
    .req-note{font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:12px}

    .ov{position:fixed;inset:0;background:rgba(2,2,55,.45);display:none;place-items:center;z-index:1000;padding:16px}
    .ov.show{display:grid}
    .modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 24px 70px rgba(4,0,58,.32);max-height:92vh;overflow:auto}
    .modal.wide{max-width:820px}
    .modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
    .modal .mh h3{margin:0;font-size:17px;color:var(--ink)}
    .modal .mb{padding:20px 22px}
    .modal .mf{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
    .x{background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1}

    .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:2000;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(2,2,55,.25);opacity:0;transform:translateY(16px);transition:.3s;max-width:380px}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.err{background:var(--danger)} .toast.ok{background:var(--ok)}
    .busy{position:fixed;inset:0;background:rgba(239,242,245,.6);backdrop-filter:blur(1px);display:none;place-items:center;z-index:3000}
    .busy.show{display:grid}
    .busy .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 30px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px}
    .busy .spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--artico);border-top-color:var(--accent);animation:spin .8s linear infinite}
    .busy .msg{color:var(--ink);font-weight:600;font-size:13px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
    .step{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
    .step .n{width:20px;height:20px;border-radius:50%;background:var(--artico);color:var(--muted);display:grid;place-items:center;font-size:11px}
    .step.done{color:var(--ok);border-color:#B7E0BC} .step.done .n{background:var(--ok);color:#fff}
    .step.cur{color:var(--accent);border-color:var(--accent)} .step.cur .n{background:var(--accent);color:#fff}

    .kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
    .flagok{color:var(--ok);font-weight:700} .flagbad{color:var(--danger);font-weight:700}
    .testline{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
    .testline .st{font-weight:700;flex:none;width:52px}
    .testline.pass .st{color:var(--ok)} .testline.fail .st{color:var(--danger)}
    .foot-links{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}

    @media(max-width:980px){.grid2,.form-grid,.form-grid.c3{grid-template-columns:1fr}.layout{flex-direction:column}
      .sidebar{width:auto;height:auto;position:relative}}
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen" style="display:none">
  <div class="login-card">
    <img class="brand-logo" src="/public/logo.png" alt="Polipay" />
    <h1>Conciliación y Liquidación T+1</h1>
    <p class="sub">Agregador / POS · MCEB · Broxel BIN Sponsor</p>
    <label for="lgNombre">Nombre del usuario</label>
    <input id="lgNombre" placeholder="Ej. Alfonso García" autocomplete="off" />
    <label for="lgRol">Rol (segregación de funciones)</label>
    <select id="lgRol">
      <option value="admin">Administrador — catálogos y todo</option>
      <option value="operador">Operador (Operaciones) — calcula, no dispersa</option>
      <option value="tesoreria">Tesorería — autoriza y marca dispersado</option>
    </select>
    <button class="btn" onclick="doLogin()">Entrar</button>
    <div class="login-foot">Prototipo local v0.4.0 · datos en este navegador (localStorage)</div>
  </div>
</div>

<!-- APP -->
<div class="layout" id="app" style="display:none">
  <aside class="sidebar">
    <img class="brand-logo" src="/public/logo.png" alt="Polipay" />
    <div class="sub">Conciliación y Liquidación T+1</div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="who"><span class="avatar" id="whoAv">?</span><div><div id="whoName">—</div><div class="rolech" id="whoRole"></div></div></div>
      <button class="btn sm secondary" style="width:100%;margin-top:10px" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>
  <main class="content">
    <div class="page-head">
      <div>
        <h2 id="viewTitle">Panel</h2>
        <div class="ph-sub" id="viewSub"></div>
      </div>
      <div id="pageAction"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="busy" id="busy"><div class="box"><div class="spin"></div><div class="msg" id="busyMsg">Procesando…</div></div></div>
<div class="toast" id="toast"></div>

<script src="/public/vendor/xlsx.full.min.js"></script>
<script>
/* ============================================================================
   Polipay · Sistema de Conciliación y Liquidación T+1  (BRD-OP-AGR-001)
   MVP Fase 1 — motor exacto (sección 6 / RN-01..16) + catálogos + ingesta +
   corte + cuadre + layout SPEI + reporte.  Sin dependencias externas.
   ========================================================================= */
'use strict';
const LS='polipay_cl_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,a={},...ch)=>{const n=document.createElement(t);for(const k in a){if(k==='class')n.className=a[k];else if(k==='html')n.innerHTML=a[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)n.setAttribute(k,a[k]);}ch.flat().forEach(c=>n.append(c==null?'':c));return n;};

/* ---------- utilidades es-MX ---------- */
const IVA_DEF=0.16;
const round2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const mxn=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(round2(n||0));
const num=n=>new Intl.NumberFormat('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}).format(round2(n||0));
const pct=n=>new Intl.NumberFormat('es-MX',{minimumFractionDigits:2,maximumFractionDigits:4}).format((n||0)*100)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast show'+(kind?' '+kind:'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='toast',2600);}
// Spinner para operaciones pesadas: muestra el overlay, cede 2 frames para que pinte y luego
// corre fn (que puede ser síncrona/bloqueante como leer un .xlsx grande) sin congelar en silencio.
function showBusy(msg){ $('#busyMsg').textContent=msg||'Procesando…'; $('#busy').classList.add('show'); }
function hideBusy(){ $('#busy').classList.remove('show'); }
async function withBusy(msg,fn){ showBusy(msg);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{ return await fn(); } finally{ hideBusy(); } }

/* ---------- fechas dd/mm/yyyy ---------- */
function parseFecha(str){
  if(str instanceof Date) return new Date(str.getFullYear(),str.getMonth(),str.getDate());
  if(!str) return null; str=String(str).trim();
  let m=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){let[_,d,mo,y]=m;y=+y;if(y<100)y+=2000;return new Date(y,+mo-1,+d);}
  m=str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/); // yyyy-mm-dd
  if(m){let[_,y,mo,d]=m;return new Date(+y,+mo-1,+d);}
  const d=new Date(str); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
const fmtFecha=d=>{if(!d)return'';const dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0');return `${dd}/${mm}/${d.getFullYear()}`;};
const isoFecha=d=>{if(!d)return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
// Convierte una hora a SEGUNDOS del día (incluye segundos si vienen: "23:00:06" → post 23:00).
// La comparación con la hora de corte usa segundos, para que 23:00:06 SÍ cuente como posterior a 23:00.
const parseHoraSeg=h=>{if(h==null||h==='')return 0;const m=String(h).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);return m?((+m[1])*3600+(+m[2])*60+(+(m[3]||0))):0;};
// Parseo robusto de monto: acepta número, "$1,234.56", "1.234,56" (europeo), "1 234,56", "MXN 1000".
function parseMonto(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  let s=String(v==null?'':v).trim(); if(!s) return 0;
  const neg=/^\(.*\)$/.test(s)||/-/.test(s);           // paréntesis o signo = negativo
  s=s.replace(/[^\d.,]/g,'');                            // quita $, letras, espacios, signos
  if(!s) return 0;
  if(s.includes(',')&&s.includes('.')){                 // ambos separadores: el último es el decimal
    if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); // 1.234,56
    else s=s.replace(/,/g,'');                            // 1,234.56
  } else if(s.includes(',')){                            // solo coma
    const p=s.split(',');
    s=(p.length===2 && p[1].length<=2) ? p[0]+'.'+p[1] : s.replace(/,/g,'');
  }
  let n=parseFloat(s); if(isNaN(n)) return 0; return neg?-Math.abs(n):n;
}
// Normaliza hora desde texto, Date (celda Excel) o número (fracción de día) → "HH:MM"
function horaStr(v){ if(v==null||v==='')return'';
  if(v instanceof Date) return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
  if(typeof v==='number'){ let mins=Math.round((v%1)*1440); const h=Math.floor(mins/60)%24,m=mins%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
  return String(v).trim(); }

/* ============================================================================
   MOTOR DE CÁLCULO  (funciones puras — expuestas en window.MOTOR para test)
   ========================================================================= */
// Quita acentos/diacríticos y normaliza (maneja é NFC vs NFD de exportaciones de Excel).
function normStr(s){ return String(s==null?'':s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,' '); }
// Nomenclatura oficial: American Express, Crédito, Débito, Internacional (+ alias/códigos comunes).
const PROD={
  'debito':'tdd','tdd':'tdd','td':'tdd','tarjeta de debito':'tdd','debito nacional':'tdd','nacional debito':'tdd',
  'credito':'tdc','tdc':'tdc','tc':'tdc','tarjeta de credito':'tdc','credito nacional':'tdc','nacional credito':'tdc',
  'american express':'amex','americanexpress':'amex','amex':'amex','ax':'amex',
  'internacional':'int','int':'int','internac':'int','intl':'int','international':'int' };
function prodKey(p){ if(p==null||p==='') return null; return PROD[normStr(p)]||null; }

let _ferKey=null,_ferSet=null;
function feriadoSet(feriados){ const arr=feriados||[]; const key=arr.join(','); if(key===_ferKey&&_ferSet) return _ferSet;
  _ferKey=key; _ferSet=new Set(arr.map(f=>typeof f==='string'?f:isoFecha(parseFecha(f)))); return _ferSet; }
function esHabil(d,fset){ const w=d.getDay(); if(w===0||w===6) return false; return !fset.has(isoFecha(d)); }
// n-ésimo día hábil DESPUÉS de `base` (no cuenta base)
function nEsimoDiaHabil(base,n,fset){ let d=new Date(base),c=0; let guard=0;
  while(c<n && guard++<3660){ d=addDays(d,1); if(esHabil(d,fset)) c++; } return d; }

// RN-12: fecha de liquidación T+n por producto con hora de corte
function fechaLiquidacion(fecha,hora,producto,params,feriados){
  const pk=prodKey(producto);
  const esAmex = pk==='amex';
  const pp = esAmex ? params.prodParams.amex : params.prodParams.nacional;
  const fset=feriadoSet(feriados);
  let base=parseFecha(fecha); if(!base) return null;
  if(parseHoraSeg(hora) > parseHoraSeg(pp.corte)) base=addDays(base,1);
  return nEsimoDiaHabil(base, pp.n, fset);
}

const ult3=af=>{const s=String(af||'').replace(/\D/g,'');return s.slice(-3).padStart(3,'0');};

// RN-02..RN-11 + sección 6.  txs: transacciones APROBADAS de un CLIENTE+AFILIACION del corte.
// cat: {tasas:{pac_tdd,...,costo_x_trx,pct_banca}, costos:{int_tdd,int_tdc,int_amex,int_int,fee_broxel}}
// ajustes: {financiamientos, contracargos_dom, contracargos_amex}
function calcularCompensacion(txs,cat,params,ajustes){
  const IVA=params.IVA;
  const t=cat.tasas||{}, c=cat.costos||{}, aj=ajustes||{};
  const fin=+aj.financiamientos||0, cc_dom=+aj.contracargos_dom||0, cc_amex=+aj.contracargos_amex||0;
  let num_trx=txs.length, m_tdd=0,m_tdc=0,m_amex=0,m_int=0;
  for(const x of txs){ const k=prodKey(x.producto); const mo=+x.monto||0;
    if(k==='tdd')m_tdd+=mo; else if(k==='tdc')m_tdc+=mo; else if(k==='amex')m_amex+=mo; else if(k==='int')m_int+=mo; }
  // costos adquirente (RN-04)
  const _int_tdd=m_tdd*(c.int_tdd||0), _int_tdc=m_tdc*(c.int_tdc||0),
        _int_amex=m_amex*(c.int_amex!=null?c.int_amex:params.tasa_int_amex),
        _int_int=m_int*(c.int_int!=null?c.int_int:params.tasa_int_int);
  const feeB=(c.fee_broxel!=null?c.fee_broxel:params.fee_broxel);
  const broxel=(m_tdd+m_tdc+m_amex+m_int)*feeB;
  // comisiones ingreso (RN-05/RN-06)
  const com_tdd=m_tdd*(t.pac_tdd||0), com_tdc=m_tdc*(t.pac_tdc||0),
        com_amex=m_amex*(t.pac_amex||0), com_int=m_int*(t.pac_int||0),
        com_trx=num_trx*(t.costo_x_trx||0);
  const iva_com_tdd=com_tdd*IVA, iva_com_tdc=com_tdc*IVA, iva_com_amex=com_amex*IVA,
        iva_com_int=com_int*IVA, iva_com_trx=com_trx*IVA;
  // importe a compensar (RN-07)
  const comp_tdd=m_tdd-(com_tdd+iva_com_tdd)-(com_trx+iva_com_trx);
  const comp_tdc=m_tdc-(com_tdc+iva_com_tdc);
  const comp_amex=m_amex-(com_amex+iva_com_amex);
  const comp_int=m_int-(com_int+iva_com_int);
  const comp_total=comp_tdd+comp_tdc+comp_amex+comp_int;
  // banca Telematic (RN-08) — informativo total
  const pct_banca=(t.pct_banca||0);
  const banca=comp_total*pct_banca, iva_banca=banca*IVA;
  // importe a dispersar (RN-09, regla confirmada: cada CC una vez en su bloque)
  const base_dom=comp_tdd+comp_tdc+comp_int;
  const banca_dom=base_dom*pct_banca, iva_banca_dom=banca_dom*IVA;
  const disp_dom=base_dom-banca_dom-iva_banca_dom-fin-cc_dom;
  const banca_amex=comp_amex*pct_banca, iva_banca_amex=banca_amex*IVA;
  const disp_amex=comp_amex-banca_amex-iva_banca_amex-cc_amex;
  const disp_total=disp_dom+disp_amex;
  // comprobación (RN-10)
  const comprobacion=disp_dom+disp_amex;
  const diferencia=comprobacion-disp_total;
  // utilidad (RN-11)
  const utilidad=(com_tdd+com_tdc+com_amex+com_int)-(_int_tdd+_int_tdc+_int_amex+_int_int)-broxel;
  return {num_trx,m_tdd,m_tdc,m_amex,m_int,
    int_tdd:_int_tdd,int_tdc:_int_tdc,int_amex:_int_amex,int_int:_int_int,broxel,
    com_tdd,com_tdc,com_amex,com_int,com_trx,
    iva_com_tdd,iva_com_tdc,iva_com_amex,iva_com_int,iva_com_trx,
    comp_tdd,comp_tdc,comp_amex,comp_int,comp_total,
    pct_banca,banca,iva_banca,
    financiamientos:fin,contracargos_dom:cc_dom,contracargos_amex:cc_amex,
    base_dom,disp_dom,disp_amex,disp_total,comprobacion,diferencia,utilidad};
}

/* ============================================================================
   HELPERS CSV
   ========================================================================= */
function parseCSV(text){ // soporta , o tab, comillas
  text=text.replace(/\r\n?/g,'\n').replace(/^﻿/,''); const rows=[]; let i=0,f='',row=[],q=false;
  const delim = (text.split('\n')[0]||'').includes('\t') && !(text.split('\n')[0]||'').includes(',') ? '\t' : ',';
  while(i<text.length){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=ch;i++;continue; }
    if(ch==='"'){q=true;i++;continue;}
    if(ch===delim){row.push(f);f='';i++;continue;}
    if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=ch;i++;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
// Normaliza un encabezado: sin acentos, minúsculas, guion_bajo (ej. "Número de Afiliación" → numero_de_afiliacion)
function normHeader(h){ return normStr(h).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
function csvToObjects(text){ const rows=parseCSV(text); if(!rows.length)return[]; const head=rows[0].map(normHeader);
  return rows.slice(1).map(r=>{const o={};head.forEach((h,idx)=>o[h]=(r[idx]!=null?String(r[idx]).trim():''));return o;}); }
function toCSV(head,rows){ const q=v=>{v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return [head.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\n'); }
function download(name,text,mime){ const b=new Blob(['﻿'+text],{type:mime||'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(b); const a=el('a',{href:u,download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }

/* ---------- Excel (SheetJS) ---------- */
// Genera y descarga un .xlsx. sheets: [{name, aoa}]. Los valores string en el aoa
// se guardan como texto (preserva CLABE con ceros); los números como número.
function saveXLSX(filename, sheets){
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>{ const ws=XLSX.utils.aoa_to_sheet(s.aoa);
    if(s.cols) ws['!cols']=s.cols;
    XLSX.utils.book_append_sheet(wb, ws, (s.name||'Hoja1').slice(0,31)); });
  XLSX.writeFile(wb, filename);
}
// aoa (matriz) → objetos con encabezados normalizados (minúsculas, guion bajo). Conserva Date y números.
function aoaToObjects(aoa){ if(!aoa||!aoa.length)return[];
  const head=aoa[0].map(normHeader);
  return aoa.slice(1).filter(r=>r&&r.some(c=>c!=null&&String(c).trim()!==''))
    .map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]!=null?r[i]:''));return o;}); }
// Lee un archivo (.xlsx/.xls o .csv/.tsv/.txt) → array de objetos. Fechas como Date, resto crudo.
async function readTabular(file){
  const name=(file.name||'').toLowerCase();
  if(/\.(csv|tsv|txt)$/.test(name)) return csvToObjects(await file.text());
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  return aoaToObjects(aoa);
}

// Resuelve la cuenta de liquidación por AFILIACIÓN dentro del grupo; si no hay una
// específica por afiliación, cae a una cuenta del grupo sin afiliación (default) o la primera.
function cuentaDe(idGrupo,afil){
  const L=DB.cuentas;
  if(afil){ const m=L.find(c=>String(c.id_grupo)===String(idGrupo)&&String(c.numero_afiliacion||'')===String(afil)); if(m)return m; }
  return L.find(c=>String(c.id_grupo)===String(idGrupo)&&!String(c.numero_afiliacion||''))
      || L.find(c=>String(c.id_grupo)===String(idGrupo));
}

// Diagnóstico: por qué una transacción podría no calcular / no entrar al corte
function diagIngesta(v){
  const tx=DB.transacciones.filter(t=>String(t.estatus).toUpperCase()==='APROBADO');
  const cuenta=(map,key)=>{map[key]=(map[key]||0)+1;};
  const prods={}, prodMonto={}, clientes={}, afils={};
  tx.forEach(t=>{ const pk=String(t.producto||'(vacío)'); cuenta(prods,pk); prodMonto[pk]=(prodMonto[pk]||0)+(+t.monto||0); cuenta(clientes,String(t.cliente||'(vacío)')); cuenta(afils,String(t.numero_afiliacion||'(vacío)')); });
  const montoTotal=tx.reduce((s,t)=>s+(+t.monto||0),0);
  const conMonto0=tx.filter(t=>(+t.monto||0)===0).length;
  const cancelaciones=tx.filter(t=>(+t.monto||0)<0);
  const montoCancel=cancelaciones.reduce((s,t)=>s+(+t.monto||0),0);
  const prodRows=Object.entries(prods).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{const ok=!!prodKey(k);return [esc(k),{num:n},{num:mxn(prodMonto[k]||0)},ok?'<span class="badge ok">'+prodKey(k).toUpperCase()+'</span>':'<span class="badge d">no reconocido</span>'];});
  const cliRows=Object.entries(clientes).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{const g=grupoPorNombre(k);return [esc(k),{num:n},g?'<span class="badge ok">grupo '+g.id_grupo+'</span>':'<span class="badge d">sin grupo en catálogo</span>'];});
  const afRows=Object.entries(afils).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{const hasTasa=DB.afilGrupo.some(a=>String(a.numero_afiliacion)===String(k));const hasCosto=!!costosDe(k);return [`<span class="mono">${esc(k)}</span>`,{num:n},hasTasa?'<span class="badge ok">con tasas</span>':'<span class="badge d">sin tasas</span>',hasCosto?'<span class="badge ok">con costos</span>':'<span class="badge w">sin costos</span>'];});
  // mapeo de columnas del último archivo cargado
  const LI=DB._lastImport||{headers:[],mapped:{}};
  const criticas=['fecha','cliente','numero_afiliacion','estatus','producto','monto'];
  const mapRows=TX_COLS.map(f=>{const h=LI.mapped[f]; const crit=criticas.includes(f); return [esc(f),h?`<span class="mono">${esc(h)}</span>`:(crit?'<span class="badge d">NO ENCONTRADA</span>':'<span class="pill">—</span>')];});
  const montoNoMapeada=!LI.mapped.monto;
  const prob = montoTotal<=0 || montoNoMapeada || prodRows.some(r=>String(r[3]).includes('no reconocido')) || cliRows.some(r=>String(r[2]).includes('sin grupo')) || afRows.some(r=>String(r[2]).includes('sin tasas'));
  const p=el('div',{class:'panel'});
  p.append(el('h3',{},'Diagnóstico de la carga'));
  if(montoTotal<=0 || montoNoMapeada)
    p.append(el('div',{class:'banner err',html:`⛔ <b>El monto total leído es ${mxn(montoTotal)}.</b> ${montoNoMapeada?'No se encontró la columna de <b>monto</b> en tu archivo':'Los montos se están leyendo en cero'}. Revisa el <b>Mapeo de columnas</b> abajo: la columna de tu Excel con el importe debe llamarse <b>monto</b> (o importe/venta/monto de venta…). Sin monto, la compensación sale negativa (solo comisiones).`}));
  p.append(el('div',{class:'banner '+(prob?'warn':'ok'),html: prob
    ? 'Hay valores que <b>no coinciden</b>. Producto “no reconocido” → no entra al corte; cliente “sin grupo” o afiliación “sin tasas” → se calcula sin comisiones; monto en cero → compensación negativa. Corrige el Excel o el catálogo.'
    : 'Columnas, productos, clientes, afiliaciones y montos coinciden con el catálogo. ✓'}));
  // Mapeo de columnas
  p.append(el('h3',{style:'font-size:14px'},'Mapeo de columnas',el('span',{class:'right'},el('span',{class:'muted',style:'font-weight:400;font-size:12px'},`Encabezados del archivo: ${esc((LI.headers||[]).join(', '))||'—'}`))));
  p.append(tableWrap(['Campo del sistema','Columna de tu archivo'],mapRows));
  const g=el('div',{class:'grid2',style:'margin-top:16px'});
  const c1=el('div',{}); c1.append(el('h3',{style:'font-size:14px'},'Productos detectados')); c1.append(tableWrap(['Producto',{t:'#'},{t:'Monto'},'Reconocido'],prodRows));
  const c2=el('div',{}); c2.append(el('h3',{style:'font-size:14px'},'Clientes detectados')); c2.append(tableWrap(['Cliente',{t:'#'},'Grupo'],cliRows));
  g.append(c1,c2); p.append(g);
  p.append(el('h3',{style:'font-size:14px;margin-top:16px'},'Afiliaciones detectadas',el('span',{class:'right'},el('span',{class:'muted',style:'font-weight:400;font-size:12px'},`${tx.length} aprobadas · ${conMonto0} con monto 0 · ${cancelaciones.length} cancelaciones (${mxn(montoCancel)})`))));
  p.append(tableWrap([{t:'Afiliación'},{t:'#'},'Tasas','Costos'],afRows));
  v.append(p);
}

  fecha:['fecha','fecha_operacion','fecha_transaccion','fecha_venta','fecha_de_operacion','date'],
  hora:['hora','time','hora_operacion','hora_transaccion'],
  cliente:['cliente','grupo','nombre_cliente','nombre_del_cliente','razon_social_cliente'],

  estatus:['estatus','estado','status'],
  metodo:['metodo','marca','red','tipo_de_tarjeta','tarjeta'],
  producto:['producto','tipo_producto','tipo_de_producto','producto_tarjeta'],
  monto:['monto','importe','monto_venta','monto_de_venta','monto_operacion','monto_de_la_operacion','monto_transaccion','monto_de_la_transaccion','monto_mxn','importe_venta','importe_transaccion','importe_de_la_transaccion','importe_mxn','venta','valor','amount','total'],
  folio:['folio','no_folio'], referencia:['referencia','ref'],
  autorizacion:['autorizacion','codigo_autorizacion','no_autorizacion','auth'], terminal:['terminal','no_terminal']
};
function pickCol(o,field){ for(const a of (TX_ALIAS[field]||[field])){ if(o[a]!=null && String(o[a]).trim()!=='') return o[a]; } return o[field]!=null?o[field]:''; }
function ingestarObjs(objs,modo){
  let validas=0,invalidas=0,monto=0; const nuevas=[];
  // captura el mapeo de columnas del archivo (para el diagnóstico)
  const headers = objs.length ? Object.keys(objs[0]) : [];
  const mapped = {}; TX_COLS.forEach(f=>{ mapped[f]=(TX_ALIAS[f]||[f]).find(a=>headers.includes(a)&&String(objs[0][a]).trim()!=='')|| (TX_ALIAS[f]||[f]).find(a=>headers.includes(a)) || null; });
  DB._lastImport={headers, mapped};
  for(const o of objs){
    const t={}; TX_COLS.forEach(c=>t[c]=pickCol(o,c));
    // normalización de tipos (soporta crudo de Excel: Date, números)
    t.cliente=String(t.cliente||'').trim(); t.comercio=String(t.comercio||'').trim();
    t.metodo=String(t.metodo||'').trim(); t.producto=String(t.producto||'').trim();
    t.numero_afiliacion=String(t.numero_afiliacion).replace(/\D/g,'');
    t.monto=parseMonto(t.monto);
    t.estatus=String(t.estatus||'').toUpperCase();
    t.hora=horaStr(t.hora);
    const rawFecha=t.fecha; const fparsed=parseFecha(rawFecha);
    t.fecha = fparsed ? fmtFecha(fparsed) : String(rawFecha||'').trim();
    const pk=prodKey(t.producto);
    t.cancelacion = t.monto<0;  // monto negativo = cancelación/reembolso (resta en el corte)
    const ok = /^\d+$/.test(t.numero_afiliacion) && !!pk && !!fparsed && Number.isFinite(t.monto);
    if(!ok){invalidas++; t._invalida=true;} else validas++;
    // fecha de liquidación (RN-12)
    if(pk && fparsed){ const fl=fechaLiquidacion(t.fecha,t.hora,t.producto,DB.params,DB.feriados); t.fecha_liq=fl?isoFecha(fl):''; }
    t.id=nextId('tx'); if(t.estatus==='APROBADO')monto+=t.monto;
    nuevas.push(t);
  }
  if(modo==='replace')DB.transacciones=nuevas; else DB.transacciones=DB.transacciones.concat(nuevas);
  bit('ingesta',`${validas} válidas, ${invalidas} inválidas (${modo})`); save();
  return {validas,invalidas,monto};
}
function ingestar(text,modo){ return ingestarObjs(csvToObjects(text),modo); }
// Recalcula fecha_liq de TODAS las transacciones con los parámetros y feriados vigentes.
function recalcularFechasLiq(){ let n=0;
  DB.transacciones.forEach(t=>{ const pk=prodKey(t.producto); const f=parseFecha(t.fecha);
    let iso='';
    if(pk && f){ const fl=fechaLiquidacion(t.fecha,t.hora,t.producto,DB.params,DB.feriados); iso=fl?isoFecha(fl):''; }
    if(t.fecha_liq!==iso){ t.fecha_liq=iso; n++; }
  });
  bit('params',`recalculó fecha de liquidación de ${n} transacción(es)`); save(); return n;
}

function crearCorte(fechaLiq){

    const cat={tasas:tasas?{pac_tdd:+tasas.tasa_pac_tdd||0,pac_tdc:+tasas.tasa_pac_tdc||0,pac_amex:+tasas.tasa_pac_amex||0,pac_int:+tasas.tasa_pac_int||0,costo_x_trx:+tasas.costo_x_trx||0,pct_banca:+tasas.pct_banca||0}:{},

    const r=calcularCompensacion(arr,cat,DB.params,{});
    const faltantes=[]; if(!g)faltantes.push('grupo'); if(!tasas)faltantes.push('tasas'); if(!costos)faltantes.push('costos'); if(!cuenta&&Math.abs(r.disp_total)>0.005)faltantes.push('cuenta');
    calculos.push({cliente,afil,id_grupo:idGrupo,razon:g?g.nombre_cliente:cliente,

/* ============================================================================
   AUTO-PRUEBAS DEL MOTOR
   ========================================================================= */
function pruebas(){
  const P=PARAMS_DEF(); const fer=['2026-05-01']; const out=[];
  const casoFecha=(desc,fecha,hora,prod,esperado,feriados)=>{ const r=fechaLiquidacion(fecha,hora,prod,P,feriados||[]); const got=fmtFecha(r); out.push({desc,got,esperado,pass:got===esperado}); };
  // RF-02 — nota: 2026: 07/08 vie, 10/08 lun; 03/08 lun, 05/08 mié
  casoFecha('Nacional viernes 22:00 → lunes','07/08/2026','22:00','Débito','10/08/2026');
  casoFecha('Nacional viernes 23:30 (post-corte) → lunes','07/08/2026','23:30','Débito','10/08/2026');
  casoFecha('Nacional lunes 23:30 (post-corte) → miércoles','03/08/2026','23:30','Débito','05/08/2026');
  casoFecha('Internacional viernes 22:00 → lunes (=Nacional)','07/08/2026','22:00','Internacional','10/08/2026');
  casoFecha('AMEX lunes 19:00 → jueves (T+3)','03/08/2026','19:00','American Express','06/08/2026');
  casoFecha('AMEX lunes 23:30 (post-corte 23:00) → viernes','03/08/2026','23:30','American Express','07/08/2026');
  casoFecha('AMEX 28/04 con feriado 01/05 → 04/05','28/04/2026','10:00','American Express','04/05/2026',fer);
  // Anexo 13.3 — control DEAL/afiliación 7194416 solo TDD
  const tasas={pac_tdd:0.025,pac_tdc:0,pac_amex:0,pac_int:0,costo_x_trx:0,pct_banca:0};
  const costos={int_tdd:0.011,int_tdc:0,int_amex:0.0247,int_int:0.0302,fee_broxel:0.0028};
  const txs=[{producto:'Débito',monto:1000},{producto:'Débito',monto:500}];
  const r=calcularCompensacion(txs,{tasas,costos},P,{});
  const chk=(desc,val,esp)=>out.push({desc,got:num(val),esperado:num(esp),pass:Math.abs(val-esp)<=0.01});
  const m=1500, com=m*0.025, ivacom=com*0.16, comp=m-(com+ivacom);
  chk('13.3 comp_tdd = comp_total',r.comp_tdd,r.comp_total);
  chk('13.3 comp_total = disp_total',r.comp_total,r.disp_total);
  chk('13.3 diferencia = 0',r.diferencia,0);
  chk('13.3 comp_tdd = m − (com+IVA)',r.comp_tdd,comp);
  chk('13.3 utilidad = com − int − broxel',r.utilidad, com-(m*0.011)-(m*0.0028));
  // RN-09 con financiamientos y contracargos (cuadre debe seguir en 0)
  const tasas2={pac_tdd:0.02,pac_tdc:0.02,pac_amex:0.03,pac_int:0.03,costo_x_trx:1,pct_banca:0.005};
  const costos2={int_tdd:0.01,int_tdc:0.012,int_amex:0.0247,int_int:0.0302,fee_broxel:0.0028};
  const txs2=[{producto:'Débito',monto:2000},{producto:'Crédito',monto:1500},{producto:'Internacional',monto:800},{producto:'American Express',monto:1200}];
  const r2=calcularCompensacion(txs2,{tasas:tasas2,costos:costos2},P,{financiamientos:50,contracargos_dom:30,contracargos_amex:20});
  out.push({desc:'RN-09 diferencia=0 con fin/CC>0',got:num(r2.diferencia),esperado:'0.00',pass:Math.abs(r2.diferencia)<=0.01});
  out.push({desc:'RN-09 disp_dom+disp_amex=disp_total',got:num(r2.disp_dom+r2.disp_amex),esperado:num(r2.disp_total),pass:Math.abs((r2.disp_dom+r2.disp_amex)-r2.disp_total)<=0.01});
  return out;
}
function vPruebas(v){
  const res=pruebas(); const pass=res.filter(r=>r.pass).length;
  v.append(el('div',{class:'banner '+(pass===res.length?'ok':'err'),html:`Resultado: <b>${pass}/${res.length}</b> pruebas correctas. Validan RF-02 (fecha de liquidación T+n) y el anexo 13.3 / RN-09 del BRD.`}));
