# Blueprint de Render — Polipay POS Settlement
# Servicio independiente. La BD es el MISMO Supabase que gestion-operaciones,
# pero aislado en el schema `conciliacion` (DB_SCHEMA). Los secretos (DATABASE_URL,
# JWT_SECRET) se capturan en el dashboard de Render, NO en el repo.
services:
  - type: web
    name: polipay-conciliacion-liquidacion
    runtime: node
    plan: starter         # servicio siempre activo (no duerme por inactividad)
    region: oregon        # cercano a Supabase us-west-2 (menor latencia)
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true      # cada git push a la rama despliega solo
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_SCHEMA
        value: conciliacion
      - key: JWT_SECRET
        sync: false        # se pega en el dashboard de Render
      - key: DATABASE_URL
        sync: false        # se pega en el dashboard de Render (cadena de Supabase)
      - key: GOOGLE_CLIENT_ID
        sync: false        # OAuth Client ID de Google (Console → Credenciales)
      - key: ALLOWED_HD
        sync: false        # Dominio Workspace permitido (ej. polipay.io) - segundo blindaje sobre el whitelist
      - key: ENCRYPTION_KEY_V1
        sync: false        # 32 bytes hex - cifrado app-layer AES-256-GCM (Fase 2). Perderla = perder datos.
      - key: HMAC_PEPPER
        sync: false        # 32 bytes hex - pepper del HMAC para hashes determinísticos (email_hash, clabe_hash)
