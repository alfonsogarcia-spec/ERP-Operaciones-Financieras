<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina Polipay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#051B3B; --navy2:#0B2E59; --navy3:#123a6b; --azul:#3083F4; --azul-claro:#E7F0FE;
    --borde:#9EC5F5; --gris:#5A6472; --ambar:#FEF3C7; --ambar-f:#F59E0B; --verde:#22C55E;
    --texto:#E6EDF7; --texto2:#9DB0CC; --panel:#071f42; --linea:#16365f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--navy);color:var(--texto);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:13px}
  .app{display:grid;grid-template-columns:330px 1fr;height:100vh}
  /* ---------- barra lateral ---------- */
  aside{background:var(--panel);border-right:1px solid var(--linea);display:flex;flex-direction:column;min-height:0}
  .marca{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
  .marca .logo{width:30px;height:30px;border-radius:8px;background:var(--azul);display:grid;place-items:center;font-family:"Pixelify Sans";font-weight:700;font-size:20px;color:#fff}
  .marca h1{font-family:"Pixelify Sans";font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
  .marca small{display:block;color:var(--texto2);font-size:11px;font-family:Inter}
  .buscar{margin:4px 14px 10px;position:relative}
  .buscar input{width:100%;background:var(--navy);border:1px solid var(--linea);color:var(--texto);border-radius:8px;padding:8px 10px 8px 30px;font:inherit;outline:none}
  .buscar input:focus{border-color:var(--azul)}
  .buscar svg{position:absolute;left:9px;top:9px;opacity:.6}
  .tabs{display:flex;gap:4px;padding:0 14px 10px}
  .tabs button{flex:1;background:transparent;border:1px solid var(--linea);color:var(--texto2);border-radius:7px;padding:6px 0;font:inherit;font-weight:500;cursor:pointer}
  .tabs button.on{background:var(--azul);border-color:var(--azul);color:#fff}
  .lista{overflow:auto;flex:1;padding:0 10px 16px}
  .grupo{margin-bottom:10px;border:1px solid var(--linea);border-radius:10px;overflow:hidden}
  .grupo>header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--navy2);cursor:pointer;user-select:none}
  .grupo>header b{font-weight:600}
  .grupo>header .cnt{margin-left:auto;font-size:11px;color:var(--texto2)}
  .grupo>header .dot{width:9px;height:9px;border-radius:2px}
  .grupo.cerrado .filas{display:none}
  .fila{display:flex;gap:10px;padding:8px 10px;border-top:1px solid var(--linea);cursor:pointer}
  .fila:hover{background:#0c2a52}
  .fila.sel{background:#103566;box-shadow:inset 3px 0 0 var(--azul)}
  .fila img{width:30px;height:30px;image-rendering:pixelated;border-radius:6px;background:#0d2c55;flex:none}
  .fila .info{min-width:0;flex:1}
  .fila .top{display:flex;align-items:center;gap:6px}
  .fila .nom{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fila .est{margin-left:auto;font-size:11px;color:var(--texto2);white-space:nowrap}
  .fila .desc{color:var(--texto2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .badge{font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 6px;white-space:nowrap}
  .b-trab{background:rgba(48,131,244,.18);color:#7fb3ff}
  .b-asig{background:rgba(245,158,11,.16);color:#fbbf24}
  .b-ok{background:rgba(34,197,94,.16);color:#4ade80}
  .b-ocio{background:rgba(157,176,204,.12);color:var(--texto2)}
  .b-pend{background:rgba(157,176,204,.12);color:var(--texto2)}
  .b-rev{background:rgba(168,85,247,.16);color:#c084fc}
  .pulso{width:7px;height:7px;border-radius:50%;background:var(--azul);box-shadow:0 0 0 0 rgba(48,131,244,.7);animation:pulso 1.4s infinite}
  @keyframes pulso{70%{box-shadow:0 0 0 7px rgba(48,131,244,0)}100%{box-shadow:0 0 0 0 rgba(48,131,244,0)}}
  .tarea{border:1px solid var(--linea);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--navy)}
  .tarea .t1{display:flex;gap:8px;align-items:center}
  .tarea .folio{font-family:"Pixelify Sans";color:var(--borde)}
  .tarea .tit{margin:6px 0;font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:11px;background:#0d2c55;border:1px solid var(--linea);border-radius:5px;padding:1px 6px;cursor:pointer}
  .vacio{color:var(--texto2);padding:18px 8px;text-align:center;line-height:1.5}
  .vacio code{background:var(--navy2);padding:1px 5px;border-radius:4px;font-size:11.5px}
  .act{display:flex;gap:8px;padding:8px 6px;border-bottom:1px solid var(--linea)}
  .act .hora{color:var(--texto2);font-size:11px;width:44px;flex:none}
  /* ---------- mapa ---------- */
  main{position:relative;overflow:hidden;background:#3f8a3a}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.arrastrando{cursor:grabbing}
  .barra{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
  .barra>*{pointer-events:auto}
  .pill{background:rgba(5,27,59,.88);border:1px solid var(--linea);border-radius:9px;padding:7px 11px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(4px)}
  .pill b{font-family:"Pixelify Sans";font-size:15px}
  .esp{flex:1}
  .btn{background:rgba(5,27,59,.88);border:1px solid var(--linea);color:var(--texto);border-radius:9px;min-width:34px;height:34px;font:inherit;font-weight:600;cursor:pointer;padding:0 10px}
  .btn:hover{border-color:var(--azul)}
  .btn.on{background:var(--azul);border-color:var(--azul)}
  .vivo{width:8px;height:8px;border-radius:50%;background:var(--verde)}
  .vivo.off{background:#ef4444}
  .ficha{position:absolute;right:12px;bottom:12px;width:300px;background:rgba(5,27,59,.94);border:1px solid var(--linea);border-radius:12px;padding:12px;display:none}
  .ficha.on{display:block}
  .ficha h3{margin:0 0 2px;font-size:16px;font-weight:600}
  .ficha .sub{color:var(--texto2);font-size:12px;margin-bottom:8px}
  .ficha .cerrar{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--texto2);font-size:18px;cursor:pointer}
  .ficha .renglon{display:flex;gap:6px;margin:4px 0;align-items:baseline}
  .ficha .renglon span{color:var(--texto2);width:70px;flex:none;font-size:12px}
  .ficha .ruta{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--borde);word-break:break-all}
  .login{position:absolute;inset:0;background:rgba(5,27,59,.82);backdrop-filter:blur(3px);display:none;place-items:center;z-index:5}
  .login.on{display:grid}
  .login .caja{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:26px 28px;width:min(360px,calc(100% - 32px));text-align:center}
  .login .logo{width:44px;height:44px;margin:0 auto 10px;border-radius:10px;background:var(--azul);display:grid;place-items:center;font-family:"Pixelify Sans";font-weight:700;font-size:28px}
  .login h2{font-family:"Pixelify Sans";margin:0 0 6px}
  .login p{color:var(--texto2);margin:0 0 16px;line-height:1.45}
  .login #gBoton{display:flex;justify-content:center;min-height:44px}
  .login .msg{color:#fca5a5;margin:12px 0 0;min-height:1em}
  .campo{width:100%;background:var(--navy2);border:1px solid var(--linea);color:var(--texto);border-radius:7px;padding:7px 9px;font:inherit;margin-bottom:6px;outline:none}
  .campo:focus{border-color:var(--azul)}
  .token-nuevo{margin-top:8px;background:var(--ambar);color:#713f12;border-radius:8px;padding:8px;font-size:12px}
  .token-nuevo code{display:block;word-break:break-all;font-size:11.5px;margin-bottom:4px;color:#422006}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:55vh 45vh}
    aside{order:2;border-right:0;border-top:1px solid var(--linea)}
    .barra .pill.ocultable{display:none}
    .ficha{left:12px;right:12px;width:auto}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="marca">
      <div class="logo">p</div>
      <div style="flex:1"><h1>Oficina Polipay</h1><small>Equipo de agentes · Grupo BECM</small></div>
      <button class="btn" id="salir" style="display:none;height:28px;font-size:12px">Salir</button>
    </div>
    <div class="buscar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="buscar" placeholder="Buscar agente, rol o tarea" autocomplete="off">
    </div>
    <div class="tabs">
      <button data-tab="equipo" class="on">Equipo</button>
      <button data-tab="tareas">Tareas</button>
      <button data-tab="actividad">Actividad</button>
      <button data-tab="conexiones" id="tabConexiones" style="display:none">Conexiones</button>
    </div>
    <div class="lista" id="lista"></div>
  </aside>
  <main>
    <canvas id="mapa"></canvas>
    <div class="barra">
      <div class="pill"><span class="vivo" id="vivo"></span><span id="reloj">--:--</span></div>
      <div class="pill"><span class="pulso"></span><b id="nTrab">0</b> trabajando</div>
      <div class="pill ocultable"><b id="nTareas">0</b> tareas abiertas</div>
      <div class="pill ocultable"><b id="nHoy">0</b> concluidas hoy</div>
      <div class="esp"></div>
      <button class="btn" id="demo" title="Simular actividad para ver la oficina en movimiento">Demo</button>
      <button class="btn" id="zMenos" title="Alejar">−</button>
      <button class="btn" id="zAjustar" title="Ver toda la oficina">⤢</button>
      <button class="btn" id="zMas" title="Acercar">+</button>
    </div>
    <div class="ficha" id="ficha"></div>
    <div class="login" id="login"><div class="caja"><div class="logo">p</div><h2>Oficina Polipay</h2><p>Inicia sesión con tu cuenta de Polipay para ver al equipo de agentes.</p><div id="gBoton"></div><p id="loginMsg" class="msg"></p></div></div>
  </main>
</div>
<script src="oficina.js"></script>
</body>
</html>
